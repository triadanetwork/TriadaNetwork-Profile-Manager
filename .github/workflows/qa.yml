name: Triada QA

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  python-qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --python ${{ matrix.python-version }} --extra dev --extra desktop
      - run: uv run python scripts/qa/release_gate.py
      - run: uv run pytest -q -m "not browser"

  web-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build:static
        working-directory: web

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: uv sync --extra desktop --extra build
      - run: uv run python scripts/qa/release_gate.py
      - run: uv run python scripts/build_desktop.py
      - name: Verify desktop artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/TriadaNetwork/TriadaNetwork.exe")) { throw "TriadaNetwork.exe missing" }
          Get-Item "dist/TriadaNetwork/TriadaNetwork.exe" | Format-List FullName,Length

  release-candidate-static:
    if: startsWith(github.ref, 'refs/tags/v2.3.0-rc.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: python scripts/qa/release_gate.py
      - run: python scripts/qa/installer_preflight.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build:static
        working-directory: web

  release-candidate-artifact:
    if: startsWith(github.ref, 'refs/tags/v2.3.0-rc.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/qa/release_gate.py
      - run: python scripts/qa/installer_preflight.py
      - run: python scripts/qa/build_source_release.py --output /tmp/triada-network-v2.3.0-rc.1.zip --top-level triada-network-v2.3.0-rc.1
      - name: Validate source artifact
        run: |
          unzip -t /tmp/triada-network-v2.3.0-rc.1.zip
          ! unzip -l /tmp/triada-network-v2.3.0-rc.1.zip | grep -E "profiles\.db|\.tnb(x)?$|\.cookies\.json$|triada-network-v2.3.0-rc.1/(logs|backups|data|cache|temp)/|/node_modules/|/\.next/|/__pycache__/"
      - uses: actions/upload-artifact@v4
        with:
          name: triada-network-v2.3.0-rc.1-source
          path: /tmp/triada-network-v2.3.0-rc.1.zip

  browser-opt-in:
    if: ${{ vars.TRIADA_RUN_BROWSER_TESTS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: uv sync --extra dev --extra desktop
      - run: uv run camoufox fetch
      - run: uv run pytest -m browser --no-network
