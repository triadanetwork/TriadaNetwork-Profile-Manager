groups:
  - name: triada-cloud
    rules:
      - alert: TriadaCloudDown
        expr: up{job="triada-cloud"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Triada Cloud is down"
          description: "Prometheus cannot scrape the cloud control plane."

      - alert: TriadaCloudNotReady
        expr: triada_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Triada Cloud readiness failed"
          description: "Readiness dependency checks are failing."

      - alert: TriadaHigh5xxRate
        expr: |
          sum(rate(triada_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(triada_http_requests_total[5m])), 1)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Triada 5xx rate is high"
          description: "More than 5% of requests are returning 5xx responses."

      - alert: TriadaHighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(triada_http_request_duration_seconds_bucket[5m]))) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Triada p95 latency is high"
          description: "Cloud control plane p95 HTTP latency is above 1.5 seconds."

      - alert: TriadaRateLimiterErrors
        expr: rate(triada_rate_limit_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Triada rate limiter has errors"
          description: "Redis-backed rate limiting is reporting failures."
